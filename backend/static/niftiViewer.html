<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NiiVue</title>
    <style>
      html,body{
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body{
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <canvas id="gl" width="640" height="640"></canvas>
  </body>
  <script type="module" async>
    import { Niivue } from "/api/v1/static/nifti/niivue.js"
    let size;
    if(document.body.clientHeight < document.body.clientWidth){
      size = document.body.clientHeight
    } else {
      size = document.body.clientWidth
    }
    document.getElementById("gl").height = size
    document.getElementById("gl").width =  size
    //hot
    let nv = new Niivue({ isResizeCanvas: false,logLevel:"error",show3Dcrosshair:true,crosshairWidth:1});
    await nv.attachTo("gl");
    function geToken(){
      let isRememberMe = localStorage.getItem('remember_me') === "true";
      return isRememberMe
        ? localStorage.getItem('access_token') || ""
        : sessionStorage.getItem('access_token') || "";
    }
    async function loadVolumeFromApi() {
      let file_id = new URLSearchParams(location.search).get("file_id")
      if(!file_id){
        return;
      }
      try {
        const response = await fetch('/api/v1/medical/nifti/file?file_id='+file_id,{
          method: 'GET',
          headers: {
            'Authorization': 'Bearer '+geToken(),
          }
        });
        if (!response.ok) throw new Error(`请求失败: ${response.status}`);

        const arrayBuffer = await response.arrayBuffer();
        await nv.loadVolumes([{ name:"dsdf3.nii",url: arrayBuffer, colormap: 'gray'}]);

      } catch (err) {
        console.error('加载体数据失败:', err);
      }
    }

    loadVolumeFromApi()
  </script>
</html>
